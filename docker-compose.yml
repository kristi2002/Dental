services:
  db:
    image: postgres:17-alpine
    container_name: dentorganizer-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: dent
      POSTGRES_PASSWORD: dent
      POSTGRES_DB: dentorganizer
    ports:
      - '5432:5432'
    volumes:
      - dentorganizer-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dent -d dentorganizer']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  dentorganizer-data:
