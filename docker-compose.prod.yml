# Production stack — the app and its database.
#
# In Coolify: create a resource → "Docker Compose", point it at this file, and
# set the domain to https://dental.testdemo.it. The SERVICE_* names below are
# Coolify's: it generates each secret once, stores it, and injects it here.
#
# For local dev use `docker-compose.yml` instead — it starts only Postgres and
# leaves the app to `npm run dev`.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Inlined into the browser bundle at build time — see the Dockerfile.
        # Change the domain here, not in the runtime environment.
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://dental.testdemo.it}
        NEXT_PUBLIC_CLINIC_NAME: ${NEXT_PUBLIC_CLINIC_NAME:-Klinika Dentare}
    restart: unless-stopped
    # Mapping form, not the `- KEY=value` list. Coolify re-serialises this file
    # before building, and a bare list entry carrying no `=` (as
    # SERVICE_FQDN_APP_3000 must) comes back out keyed by its list index —
    # "non-string key in services.app.environment: 0", and the build never starts.
    environment:
      # Tells Coolify to route the assigned domain to this service's port 3000;
      # the value is the path to serve it under.
      SERVICE_FQDN_APP_3000: /
      DATABASE_URL: postgresql://dent:${SERVICE_PASSWORD_POSTGRES}@db:5432/dentorganizer?schema=public
      # Signs the staff session cookie. Rotating it logs everyone out; it must
      # never change casually, which is why Coolify generates and keeps it.
      AUTH_SECRET: ${SERVICE_PASSWORD_64_AUTHSECRET}
      # What the jobs sidecar proves itself with. `/api/jobs/*` is reachable on
      # the practice's domain like every other route, so this is the whole of
      # the authority — and the app refuses every trigger when it is unset,
      # rather than running them for anybody.
      JOBS_SECRET: ${SERVICE_PASSWORD_64_JOBSSECRET}
      # The sweep reports what it would delete and deletes nothing until this
      # says otherwise. See `src/lib/jobs/registry.ts` for why it ships off.
      JOBS_SWEEP_APPLY: ${JOBS_SWEEP_APPLY:-false}
      FILE_STORAGE_DIR: /data/patient-files
      # Where the backup sidecar writes down what it did. Read-only to the app,
      # which only ever reports it — see src/lib/backup-status.ts.
      BACKUP_STATUS_DIR: /status

      # --- Settings the practice makes, rather than this file ----------------
      # Everything above is decided here. Everything below is decided in
      # Coolify's environment editor — and has to be *named* here anyway,
      # because a variable set there is handed to Compose, and Compose passes a
      # service only what that service asks for. Left out, `MAIL_API_KEY` in
      # Coolify is a value the app never sees, and the settings card goes on
      # reporting "not configured" with nothing to say why.
      #
      # Each default below is what the app already does when nobody has set it,
      # so an untouched deployment behaves exactly as it did.

      # Sending email: all of MAIL_PROVIDER, MAIL_API_KEY and MAIL_FROM, or
      # none of them. Unset, the send queue keeps opening a draft in whoever's
      # mail client, which is a perfectly good way to run a practice. See
      # src/lib/messages/email.ts and "Sending email" in docs/DEPLOYMENT.md.
      MAIL_PROVIDER: ${MAIL_PROVIDER:-}
      MAIL_API_KEY: ${MAIL_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-}
      # Optional, and the one option worth setting: without it a patient's
      # answer to a reminder goes back to the no-reply address it came from.
      MAIL_REPLY_TO: ${MAIL_REPLY_TO:-}

      # The clinic's own wall clock. Every appointment day is stored at UTC
      # midnight and read back against this — see src/lib/dates.ts. Its default
      # matches the sidecars' TZ below, so the schedule and the calendar cannot
      # disagree about which day it is; change both or neither.
      CLINIC_TIME_ZONE: ${CLINIC_TIME_ZONE:-Europe/Tirane}
      TZ: ${TZ:-Europe/Tirane}

      # How long a reception machine may sit unattended before the session ends.
      # See src/lib/auth/token.ts.
      SESSION_IDLE_MINUTES: ${SESSION_IDLE_MINUTES:-15}

      # The off switch for the schema sync the entrypoint runs at boot. Worth
      # having reachable: holding a deploy back from a migration is exactly the
      # decision somebody needs to make at short notice, from the UI, without
      # editing this file. See docker/entrypoint.sh.
      AUTO_DB_MIGRATE: ${AUTO_DB_MIGRATE:-true}
    volumes:
      # X-rays, photos and signed consent forms. The one piece of state Postgres
      # does not hold, and the one that no backup of the database would restore.
      - patient-files:/data
      - backup-status:/status:ro
    depends_on:
      db:
        condition: service_healthy
    expose:
      - '3000'
    # Stated here as well as in the image, and the difference is what it is for.
    #
    # The Dockerfile's own HEALTHCHECK is what Docker falls back on, and it does
    # work — but it is invisible from this file, which is the file somebody reads
    # to find out what this deployment does, and the only one Coolify shows them.
    # More to the point, nothing could *depend* on it while it was unstated: the
    # jobs sidecar below waited for the app to be started rather than to be
    # answering, because a dependency on health is a thing you write next to the
    # health you are depending on.
    #
    # `/api/health` reaches Postgres before it answers, so this says "serving and
    # able to read the practice's records", not merely "the process is alive" —
    # which is the distinction that matters on a mini-PC nobody is watching.
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/api/health > /dev/null || exit 1']
      interval: 30s
      timeout: 5s
      # The entrypoint replays migrations before the server listens, so the first
      # check must not land while that is still going. Matches the image's own
      # grace period rather than inventing a second answer.
      start_period: 60s
      retries: 3

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: dent
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
      POSTGRES_DB: dentorganizer
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      # The app's entrypoint pushes the schema before serving, so it must not
      # start until Postgres is actually accepting connections.
      test: ['CMD-SHELL', 'pg_isready -U dent -d dentorganizer']
      interval: 5s
      timeout: 5s
      retries: 10

  # The thing that makes the seven-year retention decision in
  # `src/lib/audit-retention.ts` mean something.
  #
  # Before this existed, a clinic keeping seven years of medical records had the
  # backup discipline of whoever remembered to press the button on the Staff
  # page. This container dumps the database twice a day, copies the dump and the
  # patient files to a bucket in another country, and rehearses the restore every
  # Sunday. It serves nothing and listens on nothing.
  # The clock. Holds no credential that reaches the database and no copy of the
  # app — it waits, then asks the app to do the work. See `docker/jobs/`.
  jobs:
    build:
      context: .
      dockerfile: docker/jobs/Dockerfile
    restart: unless-stopped
    environment:
      JOBS_SECRET: ${SERVICE_PASSWORD_64_JOBSSECRET}
      JOBS_APP_URL: http://app:3000
      # Every evening at six: the day's bookings have settled and whoever is on
      # the desk can still work the queue down before going home.
      REMINDERS_SCHEDULE: ${REMINDERS_SCHEDULE:-0 18 * * *}
      # And again at seven the next morning, because the evening run cannot see
      # an evening booking — a slot taken at half past six for nine tomorrow was
      # never queued at all. Free to repeat: every row the job writes carries a
      # unique dedupe key, so the second run collides and skips rather than
      # sending anybody two of anything.
      REMINDERS_MORNING_SCHEDULE: ${REMINDERS_MORNING_SCHEDULE:-0 7 * * *}
      # Sunday, a quarter past three — after the backup's own verify at 03:30
      # would be worse, so it sits before it and competes with nothing.
      SWEEP_SCHEDULE: ${SWEEP_SCHEDULE:-15 3 * * 0}
      TZ: ${TZ:-Europe/Tirane}
    # `service_healthy`, not the bare list form this used to be. The short form
    # waits only for the container to have been *started*, and the app spends
    # the first stretch of that replaying migrations without listening.
    #
    # Nothing was breaking: the jobs are on a clock rather than fired at boot,
    # and `entrypoint.sh` already probes `/api/health` on the way up and warns
    # when it gets no answer. But that warning is the sidecar reporting a race
    # it cannot do anything about, and the window is real — a restart shortly
    # before six in the evening puts a scheduled run inside it. Waiting for
    # health closes it, and turns that warning into something that should now
    # never be seen.
    #
    # `db` was already depended on this way by both other services; the app was
    # the one that could not be, for want of the healthcheck above.
    depends_on:
      app:
        condition: service_healthy

  backup:
    build:
      context: .
      dockerfile: docker/backup/Dockerfile
    restart: unless-stopped
    environment:
      # Same URL the app uses. The scripts strip Prisma's `?schema=`, which
      # libpq refuses outright rather than ignoring.
      DATABASE_URL: postgresql://dent:${SERVICE_PASSWORD_POSTGRES}@db:5432/dentorganizer?schema=public
      FILE_STORAGE_DIR: /data/patient-files
      BACKUP_STATUS_DIR: /status
      BACKUP_DIR: /backups
      # 02:00, and again over the lunch break — so the worst a bad day can cost
      # is the half of it since the last copy, rather than all of it.
      BACKUP_SCHEDULE: ${BACKUP_SCHEDULE:-0 2,13 * * *}
      VERIFY_SCHEDULE: ${VERIFY_SCHEDULE:-30 3 * * 0}
      # Whether to take one copy immediately at boot rather than waiting for the
      # first tick. On by default, because a stack that comes up at 14:00 would
      # otherwise sit unprotected until 02:00 and nobody would learn until then
      # whether any of this is configured right. Named here so it can be turned
      # off — CI does, because that first run races the app's migrations.
      BACKUP_ON_START: ${BACKUP_ON_START:-true}
      TZ: ${TZ:-Europe/Tirane}
      # The offsite copy. Unset, the container still runs and still dumps — but
      # to the same disk as the database it protects, and it says so loudly on
      # every boot. See docs/RESTORE.md for creating the bucket and the keys.
      RESTIC_REPOSITORY: ${RESTIC_REPOSITORY:-}
      RESTIC_PASSWORD: ${RESTIC_PASSWORD:-}
      AWS_ACCESS_KEY_ID: ${BACKUP_S3_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${BACKUP_S3_APPLICATION_KEY:-}
      BACKUP_KEEP_DAILY: ${BACKUP_KEEP_DAILY:-14}
      BACKUP_KEEP_WEEKLY: ${BACKUP_KEEP_WEEKLY:-8}
      BACKUP_KEEP_MONTHLY: ${BACKUP_KEEP_MONTHLY:-24}
    volumes:
      # Read-only: this container copies the radiographs, it has no business
      # changing one.
      - patient-files:/data:ro
      - backup-local:/backups
      - backup-status:/status
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
  patient-files:
  # The dumps of the last fortnight, on the server's own disk. Fast to restore
  # from and useless against the failure that actually kills a clinic — this
  # volume dies with the machine, which is what the bucket is for.
  backup-local:
  # One small JSON file per script, so the app can put "last backed up 6 hours
  # ago" on screen instead of the clinic finding out in a year.
  backup-status:
