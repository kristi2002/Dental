# Production stack — the app and its database.
#
# In Coolify: create a resource → "Docker Compose", point it at this file, and
# set the domain to https://dental.testdemo.it. The SERVICE_* names below are
# Coolify's: it generates each secret once, stores it, and injects it here.
#
# For local dev use `docker-compose.yml` instead — it starts only Postgres and
# leaves the app to `npm run dev`.

# Docker's default `json-file` driver has no size cap, and this stack is loud:
# two `crond -f -l 8` sidecars, restic narrating every backup, and the app
# logging every request-level error. Uncapped, those files grow for a year on
# the same disk as `db-data` and `patient-files` — so the way this deployment
# runs out of room is not the radiographs, it is the log of having copied them.
#
# 30 MB per service, which is days of this stack's output and not enough to
# matter beside a database.
x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: '10m'
      max-file: '3'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Inlined into the browser bundle at build time — see the Dockerfile.
        # Change the domain here, not in the runtime environment.
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://dental.testdemo.it}
        NEXT_PUBLIC_CLINIC_NAME: ${NEXT_PUBLIC_CLINIC_NAME:-Klinika Dentare}
    restart: unless-stopped
    # Mapping form, not the `- KEY=value` list. Coolify re-serialises this file
    # before building, and a bare list entry carrying no `=` (as
    # SERVICE_FQDN_APP_3000 must) comes back out keyed by its list index —
    # "non-string key in services.app.environment: 0", and the build never starts.
    environment:
      # Tells Coolify to route the assigned domain to this service's port 3000;
      # the value is the path to serve it under.
      SERVICE_FQDN_APP_3000: /
      DATABASE_URL: postgresql://dent:${SERVICE_PASSWORD_POSTGRES}@db:5432/dentorganizer?schema=public
      # Signs the staff session cookie. Rotating it logs everyone out; it must
      # never change casually, which is why Coolify generates and keeps it.
      AUTH_SECRET: ${SERVICE_PASSWORD_64_AUTHSECRET}
      # What the jobs sidecar proves itself with. `/api/jobs/*` is reachable on
      # the practice's domain like every other route, so this is the whole of
      # the authority — and the app refuses every trigger when it is unset,
      # rather than running them for anybody.
      JOBS_SECRET: ${SERVICE_PASSWORD_64_JOBSSECRET}
      # The sweep reports what it would delete and deletes nothing until this
      # says otherwise. See `src/lib/jobs/registry.ts` for why it ships off.
      JOBS_SWEEP_APPLY: ${JOBS_SWEEP_APPLY:-false}
      FILE_STORAGE_DIR: /data/patient-files
      # Where the backup sidecar writes down what it did. Read-only to the app,
      # which only ever reports it — see src/lib/backup-status.ts.
      BACKUP_STATUS_DIR: /status
      # How the app sends a reminder itself, rather than handing the receptionist
      # a wa.me link. `src/lib/messages/email.ts` reads all four at runtime, and
      # unset means the Settings page reports "not configured" and the outbox
      # offers WhatsApp only — which is the correct default, not a failure.
      #
      # These were documented in .env.production.example and in DEPLOYMENT.md but
      # never declared here, so pasting them into Coolify put them in this file's
      # interpolation scope and never in the container: the operator configured a
      # provider, redeployed, and Settings still said unset.
      MAIL_PROVIDER: ${MAIL_PROVIDER:-}
      MAIL_API_KEY: ${MAIL_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_REPLY_TO: ${MAIL_REPLY_TO:-}
      # The clinic's wall clock. Everything that asks "what day is it" resolves
      # through this (src/lib/dates.ts); unset, the container's UTC answers, and
      # an evening appointment in Tirane files against the wrong day.
      CLINIC_TIME_ZONE: ${CLINIC_TIME_ZONE:-Europe/Tirane}
      TZ: ${TZ:-Europe/Tirane}
      # How long a chart may sit open on the reception tablet before it locks.
      SESSION_IDLE_MINUTES: ${SESSION_IDLE_MINUTES:-15}
    volumes:
      # X-rays, photos and signed consent forms. The one piece of state Postgres
      # does not hold, and the one that no backup of the database would restore.
      - patient-files:/data
      - backup-status:/status:ro
    depends_on:
      db:
        condition: service_healthy
    expose:
      - '3000'
    <<: *logging
    # The image already carries this (see the Dockerfile's HEALTHCHECK), but an
    # image-level check is invisible to `docker compose ps` and to anything
    # watching the stack. Declared here, `unhealthy` becomes a state the
    # autoheal container below can act on.
    #
    # `/api/health` is deliberately unauthenticated and really does reach
    # Postgres — see src/app/api/health/route.ts — so this is a check of the
    # thing that matters rather than of whether a port is open.
    #
    # `start_period` is generous because the entrypoint replays migrations
    # before serving, and a long migration must not read as a sick container.
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/api/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    # What opts this container in to the autoheal watcher below. Nothing else
    # in the stack carries it.
    labels:
      autoheal: 'true'
    # A ceiling, so a large export or the Sunday restore drill cannot squeeze
    # Postgres on a clinic mini-PC. Node is happy inside this; the point is that
    # the database keeps its headroom no matter what the app is doing.
    mem_limit: 1g

  # Restarts a container the moment its healthcheck gives up.
  #
  # `restart: unless-stopped` does *not* do this: it restarts a container that
  # **exits**, and an app that has wedged — pool exhausted, an unhandled
  # rejection, Postgres restarted underneath it — does not exit. It sits there,
  # marked unhealthy, serving nothing. That is the failure this stack had no
  # answer to, and the one most likely to happen at five on a Friday.
  #
  # This is the local half. It cannot help if the machine itself is off, so it
  # does not replace pointing an outside monitor at
  # `https://<the practice's domain>/api/health` — see docs/DEPLOYMENT.md.
  autoheal:
    image: willfarrell/autoheal:1.2.0
    restart: unless-stopped
    environment:
      # Only containers that opt in by label, so this can never restart the
      # database out from under a running transaction.
      AUTOHEAL_CONTAINER_LABEL: autoheal
      AUTOHEAL_INTERVAL: 30
      # Time for a wedged process to finish whatever it is doing before SIGKILL.
      AUTOHEAL_DEFAULT_STOP_TIMEOUT: 30
      TZ: ${TZ:-Europe/Tirane}
    volumes:
      # Read-only: it needs to see container health and issue a restart, and
      # nothing else. This is a real grant of authority over the host's Docker —
      # the label filter above is what keeps it to the one container.
      - /var/run/docker.sock:/var/run/docker.sock
    <<: *logging

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    <<: *logging
    environment:
      POSTGRES_USER: dent
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
      POSTGRES_DB: dentorganizer
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      # The app's entrypoint pushes the schema before serving, so it must not
      # start until Postgres is actually accepting connections.
      test: ['CMD-SHELL', 'pg_isready -U dent -d dentorganizer']
      interval: 5s
      timeout: 5s
      retries: 10

  # The thing that makes the seven-year retention decision in
  # `src/lib/audit-retention.ts` mean something.
  #
  # Before this existed, a clinic keeping seven years of medical records had the
  # backup discipline of whoever remembered to press the button on the Staff
  # page. This container dumps the database twice a day, copies the dump and the
  # patient files to a bucket in another country, and rehearses the restore every
  # Sunday. It serves nothing and listens on nothing.
  # The clock. Holds no credential that reaches the database and no copy of the
  # app — it waits, then asks the app to do the work. See `docker/jobs/`.
  jobs:
    build:
      context: .
      dockerfile: docker/jobs/Dockerfile
    restart: unless-stopped
    environment:
      JOBS_SECRET: ${SERVICE_PASSWORD_64_JOBSSECRET}
      JOBS_APP_URL: http://app:3000
      # Every evening at six: the day's bookings have settled and whoever is on
      # the desk can still work the queue down before going home.
      REMINDERS_SCHEDULE: ${REMINDERS_SCHEDULE:-0 18 * * *}
      # Sunday, a quarter past three — after the backup's own verify at 03:30
      # would be worse, so it sits before it and competes with nothing.
      SWEEP_SCHEDULE: ${SWEEP_SCHEDULE:-15 3 * * 0}
      TZ: ${TZ:-Europe/Tirane}
    depends_on:
      - app
    <<: *logging

  backup:
    build:
      context: .
      dockerfile: docker/backup/Dockerfile
    restart: unless-stopped
    environment:
      # Same URL the app uses. The scripts strip Prisma's `?schema=`, which
      # libpq refuses outright rather than ignoring.
      DATABASE_URL: postgresql://dent:${SERVICE_PASSWORD_POSTGRES}@db:5432/dentorganizer?schema=public
      FILE_STORAGE_DIR: /data/patient-files
      BACKUP_STATUS_DIR: /status
      BACKUP_DIR: /backups
      # 02:00, and again over the lunch break — so the worst a bad day can cost
      # is the half of it since the last copy, rather than all of it.
      BACKUP_SCHEDULE: ${BACKUP_SCHEDULE:-0 2,13 * * *}
      VERIFY_SCHEDULE: ${VERIFY_SCHEDULE:-30 3 * * 0}
      TZ: ${TZ:-Europe/Tirane}
      # The offsite copy. Unset, the container still runs and still dumps — but
      # to the same disk as the database it protects, and it says so loudly on
      # every boot. See docs/RESTORE.md for creating the bucket and the keys.
      RESTIC_REPOSITORY: ${RESTIC_REPOSITORY:-}
      RESTIC_PASSWORD: ${RESTIC_PASSWORD:-}
      AWS_ACCESS_KEY_ID: ${BACKUP_S3_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${BACKUP_S3_APPLICATION_KEY:-}
      BACKUP_KEEP_DAILY: ${BACKUP_KEEP_DAILY:-14}
      BACKUP_KEEP_WEEKLY: ${BACKUP_KEEP_WEEKLY:-8}
      # Seven years of monthlies, because that is the retention the practice is
      # actually held to — `src/lib/audit-retention.ts` decides seven years and
      # nothing prunes the live database, so the live copy was compliant while
      # the backups reached back two. A corruption or a wrongful deletion found
      # in year three was unrecoverable.
      #
      # Nearly free: restic deduplicates, and a monthly snapshot of a clinic's
      # database is mostly blocks the previous one already holds.
      BACKUP_KEEP_MONTHLY: ${BACKUP_KEEP_MONTHLY:-84}
    volumes:
      # Read-only: this container copies the radiographs, it has no business
      # changing one.
      - patient-files:/data:ro
      - backup-local:/backups
      - backup-status:/status
    depends_on:
      db:
        condition: service_healthy
    <<: *logging
    # `pg_restore` during the Sunday drill is the most memory-hungry thing this
    # stack does, and it runs against the live database. Capped, so it competes
    # with the surgery's own Postgres rather than starving it.
    mem_limit: 768m

volumes:
  db-data:
  patient-files:
  # The dumps of the last fortnight, on the server's own disk. Fast to restore
  # from and useless against the failure that actually kills a clinic — this
  # volume dies with the machine, which is what the bucket is for.
  backup-local:
  # One small JSON file per script, so the app can put "last backed up 6 hours
  # ago" on screen instead of the clinic finding out in a year.
  backup-status:
