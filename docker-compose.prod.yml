# Production stack — the app and its database.
#
# In Coolify: create a resource → "Docker Compose", point it at this file, and
# set the domain to https://dental.testdemo.it. The SERVICE_* names below are
# Coolify's: it generates each secret once, stores it, and injects it here.
#
# For local dev use `docker-compose.yml` instead — it starts only Postgres and
# leaves the app to `npm run dev`.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Inlined into the browser bundle at build time — see the Dockerfile.
        # Change the domain here, not in the runtime environment.
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://dental.testdemo.it}
        NEXT_PUBLIC_CLINIC_NAME: ${NEXT_PUBLIC_CLINIC_NAME:-Klinika Dentare}
    restart: unless-stopped
    # Mapping form, not the `- KEY=value` list. Coolify re-serialises this file
    # before building, and a bare list entry carrying no `=` (as
    # SERVICE_FQDN_APP_3000 must) comes back out keyed by its list index —
    # "non-string key in services.app.environment: 0", and the build never starts.
    environment:
      # Tells Coolify to route the assigned domain to this service's port 3000;
      # the value is the path to serve it under.
      SERVICE_FQDN_APP_3000: /
      DATABASE_URL: postgresql://dent:${SERVICE_PASSWORD_POSTGRES}@db:5432/dentorganizer?schema=public
      # Signs the staff session cookie. Rotating it logs everyone out; it must
      # never change casually, which is why Coolify generates and keeps it.
      AUTH_SECRET: ${SERVICE_PASSWORD_64_AUTHSECRET}
      FILE_STORAGE_DIR: /data/patient-files
      # Where the backup sidecar writes down what it did. Read-only to the app,
      # which only ever reports it — see src/lib/backup-status.ts.
      BACKUP_STATUS_DIR: /status
    volumes:
      # X-rays, photos and signed consent forms. The one piece of state Postgres
      # does not hold, and the one that no backup of the database would restore.
      - patient-files:/data
      - backup-status:/status:ro
    depends_on:
      db:
        condition: service_healthy
    expose:
      - '3000'

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: dent
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
      POSTGRES_DB: dentorganizer
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      # The app's entrypoint pushes the schema before serving, so it must not
      # start until Postgres is actually accepting connections.
      test: ['CMD-SHELL', 'pg_isready -U dent -d dentorganizer']
      interval: 5s
      timeout: 5s
      retries: 10

  # The thing that makes the seven-year retention decision in
  # `src/lib/audit-retention.ts` mean something.
  #
  # Before this existed, a clinic keeping seven years of medical records had the
  # backup discipline of whoever remembered to press the button on the Staff
  # page. This container dumps the database twice a day, copies the dump and the
  # patient files to a bucket in another country, and rehearses the restore every
  # Sunday. It serves nothing and listens on nothing.
  backup:
    build:
      context: .
      dockerfile: docker/backup/Dockerfile
    restart: unless-stopped
    environment:
      # Same URL the app uses. The scripts strip Prisma's `?schema=`, which
      # libpq refuses outright rather than ignoring.
      DATABASE_URL: postgresql://dent:${SERVICE_PASSWORD_POSTGRES}@db:5432/dentorganizer?schema=public
      FILE_STORAGE_DIR: /data/patient-files
      BACKUP_STATUS_DIR: /status
      BACKUP_DIR: /backups
      # 02:00, and again over the lunch break — so the worst a bad day can cost
      # is the half of it since the last copy, rather than all of it.
      BACKUP_SCHEDULE: ${BACKUP_SCHEDULE:-0 2,13 * * *}
      VERIFY_SCHEDULE: ${VERIFY_SCHEDULE:-30 3 * * 0}
      TZ: ${TZ:-Europe/Tirane}
      # The offsite copy. Unset, the container still runs and still dumps — but
      # to the same disk as the database it protects, and it says so loudly on
      # every boot. See docs/RESTORE.md for creating the bucket and the keys.
      RESTIC_REPOSITORY: ${RESTIC_REPOSITORY:-}
      RESTIC_PASSWORD: ${RESTIC_PASSWORD:-}
      AWS_ACCESS_KEY_ID: ${BACKUP_S3_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${BACKUP_S3_APPLICATION_KEY:-}
      BACKUP_KEEP_DAILY: ${BACKUP_KEEP_DAILY:-14}
      BACKUP_KEEP_WEEKLY: ${BACKUP_KEEP_WEEKLY:-8}
      BACKUP_KEEP_MONTHLY: ${BACKUP_KEEP_MONTHLY:-24}
    volumes:
      # Read-only: this container copies the radiographs, it has no business
      # changing one.
      - patient-files:/data:ro
      - backup-local:/backups
      - backup-status:/status
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
  patient-files:
  # The dumps of the last fortnight, on the server's own disk. Fast to restore
  # from and useless against the failure that actually kills a clinic — this
  # volume dies with the machine, which is what the bucket is for.
  backup-local:
  # One small JSON file per script, so the app can put "last backed up 6 hours
  # ago" on screen instead of the clinic finding out in a year.
  backup-status:
