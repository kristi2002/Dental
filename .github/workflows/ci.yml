# The checks that would have caught what this repository was shipping.
#
# Every one of these steps corresponds to something that was actually broken and
# stayed broken because nothing ran: a lockfile that failed `npm ci` while
# `npm install` papered over it, a migrations directory nine commits behind the
# schema, 374 tests nobody executed on a push.
#
# Kept to one job on purpose. The whole thing runs in a couple of minutes, and a
# matrix of parallel jobs that each spend forty seconds installing would be
# slower and harder to read.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # So a red main can be re-checked without an empty commit.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      # Needed by the schema drift check, which replays the migration history
      # into a scratch database. Nothing else here touches a database.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: dent
          POSTGRES_PASSWORD: dent
          POSTGRES_DB: dentorganizer
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dent -d dentorganizer"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://dent:dent@localhost:5432/dentorganizer?schema=public
      # A database the role may create and drop; `migrate diff --from-migrations`
      # replays the history into it.
      SHADOW_DATABASE_URL: postgresql://dent:dent@localhost:5432/shadow?schema=public

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # `npm ci`, not `npm install`. The difference is the entire point: `ci`
      # fails on a lockfile out of sync with package.json, which is what the
      # Dockerfile does and what had been broken.
      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Almost every test here is pure and needs nothing. `query-layer.test.ts`
      # is the exception, and deliberately so: the four bugs it guards all lived
      # in the seam between worked-out logic and a Prisma `where`, which is
      # precisely the seam a pure test cannot reach. It skips itself when there
      # is no migrated database, so this step is what makes it actually run —
      # without it the suite would go green having quietly tested nothing.
      - name: Prepare the test database
        run: npx prisma migrate deploy

      - name: Test
        run: npm test

      # Does prisma/migrations still describe prisma/schema.prisma?
      #
      # --exit-code makes an empty diff 0 and a non-empty diff 2, so a schema
      # change committed without its migration fails here rather than at the
      # next deploy. This is the check whose absence let three whole models
      # exist in the schema and in no migration.
      - name: Create the shadow database
        run: PGPASSWORD=dent psql -h localhost -U dent -d dentorganizer -c 'CREATE DATABASE shadow;'

      - name: Schema and migrations must agree
        run: |
          npx prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema prisma/schema.prisma \
            --exit-code \
          || {
            echo "::error::prisma/migrations no longer describes prisma/schema.prisma."
            echo "Author the missing migration — see 'Schema changes' in docs/DEPLOYMENT.md."
            exit 1
          }

      # And does that history actually replay? A migration can be generated
      # correctly and still fail on a real database.
      - name: Migrations must replay into an empty database
        run: |
          PGPASSWORD=dent psql -h localhost -U dent -d dentorganizer -c 'CREATE DATABASE replay;'
          DATABASE_URL='postgresql://dent:dent@localhost:5432/replay?schema=public' \
            npx prisma migrate deploy

      # The step that was failing in the dark. `next build` is what the
      # Dockerfile runs, and it is where a broken install or a bad import
      # surfaces.
      - name: Build
        run: npm run build
        env:
          AUTH_SECRET: ci-placeholder-never-signs-a-real-cookie

  # The artefact that actually ships.
  #
  # `check` above runs `migrate deploy` against the repository, where the
  # migrations obviously exist — and passed while the image had none, because
  # nothing imports a `.sql` file and Next's tracer left them out of the
  # standalone output. The container started, found an empty migrations
  # directory and exited; the deploy log said "Started" and stayed green.
  #
  # So this job builds the Dockerfile and boots it. Anything the image is
  # missing shows up as a container that will not serve, which is the only
  # question that matters about a production image.
  image:
    name: Production image
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: dent
          POSTGRES_PASSWORD: dent
          POSTGRES_DB: dentorganizer
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dent -d dentorganizer"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # `--network host` below, so the container reaches the service container
      # on the runner's own localhost.
      APP_DATABASE_URL: postgresql://dent:dent@localhost:5432/dentorganizer?schema=public
      APP_AUTH_SECRET: ci-placeholder-never-signs-a-real-cookie

    steps:
      - uses: actions/checkout@v7

      - name: Build the production image
        run: docker build -t dentorganizer:ci .

      # Named separately from the boot below so the failure says which of the
      # two went wrong. `migrate deploy` cannot replay what is not there.
      - name: The migration history must be in the image
        run: |
          # `--entrypoint sh`, because the image's own entrypoint would run the
          # schema sync first and fail here on a missing DATABASE_URL.
          count=$(docker run --rm --entrypoint sh dentorganizer:ci -c 'ls -1 /app/prisma/migrations 2>/dev/null | wc -l')
          echo "migrations directory holds $count entries"
          if [ "$count" -lt 2 ]; then
            echo "::error::/app/prisma/migrations is missing or empty — check the COPY lines in the Dockerfile's runner stage."
            exit 1
          fi

      - name: Boot it against an empty database
        run: |
          docker run -d --name dent-ci --network host \
            -e DATABASE_URL="$APP_DATABASE_URL" \
            -e AUTH_SECRET="$APP_AUTH_SECRET" \
            dentorganizer:ci

      # Polls rather than sleeping, and gives up the moment the container dies —
      # an early exit is this job's whole reason for existing, and waiting two
      # minutes to report one would bury it.
      - name: It must actually serve
        run: |
          for _ in $(seq 1 60); do
            if curl -fsS http://localhost:3000/api/health 2>/dev/null | grep -q '"status":"ok"'; then
              echo "health: ok"
              # Follows the redirect on purpose. This database is empty, so it
              # has no staff accounts, and `/sq/login` hands over to the
              # first-run `/sq/setup` page — which is the app working, not
              # failing. What is being asserted is that a page renders at all,
              # not which one.
              out=$(curl -fsSL -o /dev/null \
                -w '%{http_code} %{url_effective}' http://localhost:3000/sq/login)
              code=${out%% *}
              url=${out#* }
              echo "rendered $url -> $code"
              [ "$code" = "200" ] || { echo "::error::the app is up but $url returned $code"; exit 1; }
              exit 0
            fi
            if [ -z "$(docker ps -q --filter name=dent-ci --filter status=running)" ]; then
              echo "::error::the container exited before it served a request."
              exit 1
            fi
            sleep 2
          done
          echo "::error::timed out waiting for /api/health."
          exit 1

      # The guard that refuses a database the old `db push` workflow built —
      # tables present, no `_prisma_migrations` to say which migrations made
      # them. Replaying `0_init` over one would try to CREATE TABLE "Patient"
      # on top of a table holding patients, so the entrypoint stops instead.
      #
      # Asserted in the negative: this boot is *supposed* to fail, and a
      # successful start would mean the guard had quietly stopped guarding.
      - name: It must refuse an un-baselined database
        run: |
          PGPASSWORD=dent psql -h localhost -U dent -d dentorganizer -c 'CREATE DATABASE pushed;'

          # Build one the old way, using the CLI the image already carries.
          docker run --rm --network host \
            -e DATABASE_URL="postgresql://dent:dent@localhost:5432/pushed?schema=public" \
            --entrypoint node dentorganizer:ci \
            /opt/prisma-cli/node_modules/prisma/build/index.js db push \
            --config=/opt/prisma-cli/prisma.config.mjs

          # A working guard exits within seconds. The timeout is for the failure
          # case, where the entrypoint sails past and `node server.js` runs for ever.
          if timeout 120 docker run --rm --network host \
               -e DATABASE_URL="postgresql://dent:dent@localhost:5432/pushed?schema=public" \
               -e AUTH_SECRET="$APP_AUTH_SECRET" \
               dentorganizer:ci > unbaselined.log 2>&1; then
            echo "::error::the entrypoint started against an un-baselined database — the guard is gone."
            cat unbaselined.log
            exit 1
          fi

          if ! grep -q "_prisma_migrations table" unbaselined.log; then
            echo "::error::it refused, but not for the baseline reason — read the log."
            cat unbaselined.log
            exit 1
          fi
          echo "refused, as it should:"
          grep "entrypoint" unbaselined.log | tail -5

      # Always, because the interesting case is the one where a step above
      # failed — and `|| true` because a build that never produced a container
      # should not have its real error hidden behind "no such container".
      - name: Container logs
        if: always()
        run: docker logs dent-ci 2>&1 | tail -60 || true

  # The stack, rather than the app on its own.
  #
  # `image` above proves the thing Coolify builds; this proves the thing Coolify
  # *runs*. Until now neither `docker/jobs/Dockerfile` nor
  # `docker/backup/Dockerfile` was built by anything, and `docker-compose.prod.yml`
  # — the file the deployment is actually described by — was never brought up.
  #
  # The three assertions below are the ones that cannot be made against a single
  # container: that a setting made outside the compose file reaches the process
  # that reads it, that the clock and the app agree about a shared secret, and
  # that the backup writes something the app can read back.
  stack:
    name: Compose stack
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      # Coolify generates the three SERVICE_* secrets, stores them, and injects
      # them. A `.env` file stands in for that — and a file rather than exported
      # shell variables on purpose, for two reasons: it is the form Coolify
      # uses, and `docker compose` ignores `TZ` from the process environment
      # while honouring it from here.
      #
      # `.env` is in `.dockerignore`, so none of this reaches a build context.
      - name: Stand in for Coolify's generated secrets
        run: |
          cat > .env <<'ENV'
          SERVICE_PASSWORD_POSTGRES=ci-postgres-password-guards-nothing
          SERVICE_PASSWORD_64_AUTHSECRET=ci-auth-secret-never-signs-a-real-cookie
          SERVICE_PASSWORD_64_JOBSSECRET=ci-jobs-secret-never-guards-a-real-clinic
          MAIL_PROVIDER=brevo
          MAIL_API_KEY=ci-not-a-real-key
          MAIL_FROM="CI <no-reply@example.invalid>"
          CLINIC_TIME_ZONE=Europe/Rome
          ENV
          echo "wrote .env with $(grep -c . .env) settings"

      - name: Build every image in the stack
        run: docker compose -f docker-compose.prod.yml build

      # `--wait` returns when `db` and `app` report healthy and the two sidecars
      # are up; a container that dies on the way takes this step down with it.
      # The app's own health check has a 60s start period, hence the timeout.
      - name: Bring the stack up
        run: docker compose -f docker-compose.prod.yml up -d --wait --wait-timeout 300

      # The check that would have caught a `MAIL_API_KEY` set in Coolify,
      # accepted without complaint, and never seen by the process that reads it.
      # Compose hands a service only the variables the file names, so this is
      # really asking whether `services.app.environment` is still complete.
      - name: Settings made outside the compose file must reach the app
        run: |
          docker compose -f docker-compose.prod.yml exec -T app node -e '
            const want = {
              MAIL_PROVIDER: "brevo",
              MAIL_API_KEY: "ci-not-a-real-key",
              MAIL_FROM: "CI <no-reply@example.invalid>",
              CLINIC_TIME_ZONE: "Europe/Rome",
            };
            let bad = 0;
            for (const [key, expected] of Object.entries(want)) {
              const got = process.env[key];
              if (got === expected) { console.log(key + ": ok"); continue; }
              console.error("::error::" + key + " did not reach the app container. Expected " +
                JSON.stringify(expected) + ", got " + JSON.stringify(got) +
                " — name it in services.app.environment in docker-compose.prod.yml.");
              bad += 1;
            }
            process.exitCode = bad ? 1 : 0;
          '

      # The sidecar's whole authority is a shared secret, and the app answers
      # 404 for one that does not match — deliberately indistinguishable from an
      # unknown job name, which means nothing short of a real call can tell you
      # the two halves agree. So this runs the real script, from the real
      # container, over the real network.
      - name: The jobs sidecar must be able to trigger a job
        run: |
          docker compose -f docker-compose.prod.yml exec -T jobs \
            /usr/local/bin/run-job.sh queue-appointment-reminders

      # A dump nothing has read back is a file, not a backup. `run-backup.sh`
      # makes that distinction itself, walking the archive's table of contents
      # before accepting the dump, so what is asserted here is only that it
      # said so in the form the app parses.
      #
      # Deliberately the copy taken at boot rather than one triggered by hand
      # once everything has conveniently settled: `BACKUP_ON_START` is left at
      # its default, so this is the run a real deployment gets. That makes it
      # the regression test for the wait in `run-backup.sh` — this container
      # waits for Postgres and not for the app, and without that wait the boot
      # copy dumps a database mid-migration, finds no tables, and writes a
      # failure. `up --wait` does not catch it, because that failure is
      # deliberately non-fatal, so the status file is the only witness.
      - name: The backup taken at boot must succeed
        run: |
          for _ in $(seq 1 40); do
            if docker compose -f docker-compose.prod.yml exec -T backup \
                 jq -e '.state == "ok" and .dump.bytes > 0' /status/backup.json >/dev/null 2>&1; then
              docker compose -f docker-compose.prod.yml exec -T backup \
                jq -c '{state, message, dump}' /status/backup.json
              exit 0
            fi
            sleep 3
          done
          echo "::error::the backup taken at boot did not report success within 120s."
          docker compose -f docker-compose.prod.yml exec -T backup \
            sh -c 'cat /status/backup.json 2>/dev/null || echo "no status file"'
          exit 1

      # `backup-status` is mounted read-only into the app, and that mount is the
      # only reason the Backups card can say anything at all. Written by root in
      # one container and read by uid 1001 in another, which is exactly the kind
      # of arrangement that works until somebody tidies a volume declaration.
      - name: The app must be able to read the backup status back
        run: |
          docker compose -f docker-compose.prod.yml exec -T app node -e '
            const { readFileSync } = require("node:fs");
            const status = JSON.parse(readFileSync(process.env.BACKUP_STATUS_DIR + "/backup.json", "utf8"));
            console.log("state:", status.state, "-", status.dump.bytes, "bytes");
            if (status.state !== "ok") {
              console.error("::error::the app read the status file but it does not say ok.");
              process.exitCode = 1;
            }
          '

      # The entrypoint warns rather than fails when patient files are not on a
      # mount, because a smoke test legitimately has no volume. Production is
      # not a smoke test, and the warning is the only sign — so here the absence
      # of it is the assertion.
      - name: Patient files must be on a mounted volume
        run: |
          if docker compose -f docker-compose.prod.yml logs app | grep -q "NOT a mounted volume"; then
            echo "::error::the app warned that its storage directory is not a mount — check the patient-files volume in docker-compose.prod.yml."
            exit 1
          fi
          echo "no warning in the app log"

      - name: Stack logs
        if: always()
        run: docker compose -f docker-compose.prod.yml logs --tail 100 || true

      # `-v` because the volumes are this job's own and a runner that keeps them
      # is a runner whose next run is not testing a fresh stack.
      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.prod.yml down -v || true
