# The checks that would have caught what this repository was shipping.
#
# Every one of these steps corresponds to something that was actually broken and
# stayed broken because nothing ran: a lockfile that failed `npm ci` while
# `npm install` papered over it, a migrations directory nine commits behind the
# schema, 374 tests nobody executed on a push.
#
# Kept to one job on purpose. The whole thing runs in a couple of minutes, and a
# matrix of parallel jobs that each spend forty seconds installing would be
# slower and harder to read.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # So a red main can be re-checked without an empty commit.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      # Needed by the schema drift check, which replays the migration history
      # into a scratch database. Nothing else here touches a database.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: dent
          POSTGRES_PASSWORD: dent
          POSTGRES_DB: dentorganizer
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dent -d dentorganizer"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://dent:dent@localhost:5432/dentorganizer?schema=public
      # A database the role may create and drop; `migrate diff --from-migrations`
      # replays the history into it.
      SHADOW_DATABASE_URL: postgresql://dent:dent@localhost:5432/shadow?schema=public

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci`, not `npm install`. The difference is the entire point: `ci`
      # fails on a lockfile out of sync with package.json, which is what the
      # Dockerfile does and what had been broken.
      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # Does prisma/migrations still describe prisma/schema.prisma?
      #
      # --exit-code makes an empty diff 0 and a non-empty diff 2, so a schema
      # change committed without its migration fails here rather than at the
      # next deploy. This is the check whose absence let three whole models
      # exist in the schema and in no migration.
      - name: Create the shadow database
        run: PGPASSWORD=dent psql -h localhost -U dent -d dentorganizer -c 'CREATE DATABASE shadow;'

      - name: Schema and migrations must agree
        run: |
          npx prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema prisma/schema.prisma \
            --exit-code \
          || {
            echo "::error::prisma/migrations no longer describes prisma/schema.prisma."
            echo "Author the missing migration — see 'Schema changes' in docs/DEPLOYMENT.md."
            exit 1
          }

      # And does that history actually replay? A migration can be generated
      # correctly and still fail on a real database.
      - name: Migrations must replay into an empty database
        run: |
          PGPASSWORD=dent psql -h localhost -U dent -d dentorganizer -c 'CREATE DATABASE replay;'
          DATABASE_URL='postgresql://dent:dent@localhost:5432/replay?schema=public' \
            npx prisma migrate deploy

      # The step that was failing in the dark. `next build` is what the
      # Dockerfile runs, and it is where a broken install or a bad import
      # surfaces.
      - name: Build
        run: npm run build
        env:
          AUTH_SECRET: ci-placeholder-never-signs-a-real-cookie

  # The artefact that actually ships.
  #
  # `check` above runs `migrate deploy` against the repository, where the
  # migrations obviously exist — and passed while the image had none, because
  # nothing imports a `.sql` file and Next's tracer left them out of the
  # standalone output. The container started, found an empty migrations
  # directory and exited; the deploy log said "Started" and stayed green.
  #
  # So this job builds the Dockerfile and boots it. Anything the image is
  # missing shows up as a container that will not serve, which is the only
  # question that matters about a production image.
  image:
    name: Production image
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: dent
          POSTGRES_PASSWORD: dent
          POSTGRES_DB: dentorganizer
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dent -d dentorganizer"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # `--network host` below, so the container reaches the service container
      # on the runner's own localhost.
      APP_DATABASE_URL: postgresql://dent:dent@localhost:5432/dentorganizer?schema=public
      APP_AUTH_SECRET: ci-placeholder-never-signs-a-real-cookie

    steps:
      - uses: actions/checkout@v4

      - name: Build the production image
        run: docker build -t dentorganizer:ci .

      # Named separately from the boot below so the failure says which of the
      # two went wrong. `migrate deploy` cannot replay what is not there.
      - name: The migration history must be in the image
        run: |
          # `--entrypoint sh`, because the image's own entrypoint would run the
          # schema sync first and fail here on a missing DATABASE_URL.
          count=$(docker run --rm --entrypoint sh dentorganizer:ci -c 'ls -1 /app/prisma/migrations 2>/dev/null | wc -l')
          echo "migrations directory holds $count entries"
          if [ "$count" -lt 2 ]; then
            echo "::error::/app/prisma/migrations is missing or empty — check the COPY lines in the Dockerfile's runner stage."
            exit 1
          fi

      - name: Boot it against an empty database
        run: |
          docker run -d --name dent-ci --network host \
            -e DATABASE_URL="$APP_DATABASE_URL" \
            -e AUTH_SECRET="$APP_AUTH_SECRET" \
            dentorganizer:ci

      # Polls rather than sleeping, and gives up the moment the container dies —
      # an early exit is this job's whole reason for existing, and waiting two
      # minutes to report one would bury it.
      - name: It must actually serve
        run: |
          for _ in $(seq 1 60); do
            if curl -fsS http://localhost:3000/api/health 2>/dev/null | grep -q '"status":"ok"'; then
              echo "health: ok"
              code=$(curl -fsS -o /dev/null -w '%{http_code}' http://localhost:3000/sq/login)
              echo "login page: $code"
              [ "$code" = "200" ] || { echo "::error::the app is up but /sq/login returned $code"; exit 1; }
              exit 0
            fi
            if [ -z "$(docker ps -q --filter name=dent-ci --filter status=running)" ]; then
              echo "::error::the container exited before it served a request."
              exit 1
            fi
            sleep 2
          done
          echo "::error::timed out waiting for /api/health."
          exit 1

      # The guard that refuses a database the old `db push` workflow built —
      # tables present, no `_prisma_migrations` to say which migrations made
      # them. Replaying `0_init` over one would try to CREATE TABLE "Patient"
      # on top of a table holding patients, so the entrypoint stops instead.
      #
      # Asserted in the negative: this boot is *supposed* to fail, and a
      # successful start would mean the guard had quietly stopped guarding.
      - name: It must refuse an un-baselined database
        run: |
          PGPASSWORD=dent psql -h localhost -U dent -d dentorganizer -c 'CREATE DATABASE pushed;'

          # Build one the old way, using the CLI the image already carries.
          docker run --rm --network host \
            -e DATABASE_URL="postgresql://dent:dent@localhost:5432/pushed?schema=public" \
            --entrypoint node dentorganizer:ci \
            /opt/prisma-cli/node_modules/prisma/build/index.js db push \
            --config=/opt/prisma-cli/prisma.config.mjs

          # A working guard exits within seconds. The timeout is for the failure
          # case, where the entrypoint sails past and `node server.js` runs for ever.
          if timeout 120 docker run --rm --network host \
               -e DATABASE_URL="postgresql://dent:dent@localhost:5432/pushed?schema=public" \
               -e AUTH_SECRET="$APP_AUTH_SECRET" \
               dentorganizer:ci > unbaselined.log 2>&1; then
            echo "::error::the entrypoint started against an un-baselined database — the guard is gone."
            cat unbaselined.log
            exit 1
          fi

          if ! grep -q "_prisma_migrations table" unbaselined.log; then
            echo "::error::it refused, but not for the baseline reason — read the log."
            cat unbaselined.log
            exit 1
          fi
          echo "refused, as it should:"
          grep "entrypoint" unbaselined.log | tail -5

      # Always, because the interesting case is the one where a step above
      # failed — and `|| true` because a build that never produced a container
      # should not have its real error hidden behind "no such container".
      - name: Container logs
        if: always()
        run: docker logs dent-ci 2>&1 | tail -60 || true
